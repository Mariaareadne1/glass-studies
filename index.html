<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glass Studies</title>
    <meta name="description" content="An exploration of light, material, and interaction — six interactive liquid-glass instruments." />
    <meta name="theme-color" content="#f3f1ef" />
    <script>
      // apply the stored or system theme before first paint (no light flash in dark mode)
      try {
        var t = JSON.parse(localStorage.getItem('glass-studies:v1:theme') || 'null');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
